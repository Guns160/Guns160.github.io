  <title>Claude Gmail MCP — Personal App</title>

<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="index.html">Claude Gmail MCP</a>
      <nav aria-label="页面导航"><a href="privacy.html">隐私说明</a></nav>
    </header>
    <main>
      <p class="eyebrow">Personal Desktop Integration</p>
      <h1>连接自己的 Gmail 与 Claude</h1>
      <p class="lead">供本人在桌面 Claude 中处理自己的邮件，不向其他用户分发客户端配置。</p>
      <section aria-labelledby="purpose">
        <h2 id="purpose">应用用途</h2>
        <p>按本人请求查阅邮件、整理标签、处理草稿及执行连接器支持的发送操作。使用 <code>gmail.modify</code> 权限，首次使用需要本人授权。</p>
      </section>
      <section aria-labelledby="website">
        <h2 id="website">说明网站</h2>
        <p>本网站不连接 Gmail，也没有登录或邮件上传入口。密钥与令牌保存在本机客户端。邮件处理涉及的服务见<a href="privacy.html">隐私说明</a>。</p>
      </section>
    </main>
    <footer><span>个人自用 · 2026-10-25</span><a href="privacy.html">Privacy Notice</a></footer>
  </div>
